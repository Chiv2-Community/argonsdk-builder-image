name: Hosted Windows engine build (experimental)
on:
  workflow_dispatch:
  push:
    branches: [feature/image-consumer-contract]
    paths:
      - .github/workflows/windows-engine.yml
      - scripts/build-windows-engine.ps1
      - scripts/check-windows-dependencies.ps1
      - scripts/windows-build-configuration.xml
      - scripts/validate-windows-builder.ps1
      - scripts/test-windows-runtime.ps1
      - scripts/collect-windows-diagnostics.ps1
permissions:
  contents: read
concurrency:
  group: argonsdk-windows-engine
  cancel-in-progress: false
jobs:
  engine:
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: builder
          persist-credentials: false
      - name: Read pinned UE revision
        run: |
          $lock = Get-Content builder/build-lock.json -Raw | ConvertFrom-Json
          if ($lock.engine.branch -ne '4.25-plus' -or $lock.engine.commit -notmatch '^[0-9a-f]{40}$') {
            throw 'Pinned UE 4.25-plus is required'
          }
          "UE_COMMIT=$($lock.engine.commit)" >> $env:GITHUB_ENV
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Git long-path configuration failed' }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: EpicGames/UnrealEngine
          ref: ${{ env.UE_COMMIT }}
          token: ${{ secrets.UE_GITHUB_TOKEN }}
          path: ue
          persist-credentials: false
      - name: Build pinned Win64 editor and tools
        run: |
          # GitDependencies uses legacy .NET path handling, not Git's long-path support.
          if (Test-Path D:/ue) { throw 'Short engine checkout path already exists' }
          Move-Item -LiteralPath ./ue -Destination D:/ue
          ./builder/scripts/build-windows-engine.ps1 -Engine D:/ue
      - name: Smoke-test Windows cooker runtime
        run: ./builder/scripts/test-windows-runtime.ps1 -Engine D:/ue
      - name: Cook and package external source on Windows
        env:
          MOD_DESCRIPTOR_JSON: ${{ secrets.MOD_DESCRIPTOR_JSON }}
        run: |
          if (!$env:MOD_DESCRIPTOR_JSON) { throw 'An external MOD_DESCRIPTOR_JSON secret is required for source-cook validation' }
          $descriptor = Join-Path $env:RUNNER_TEMP 'mod-descriptor.json'
          [IO.File]::WriteAllText($descriptor, $env:MOD_DESCRIPTOR_JSON)
          ./builder/scripts/validate-windows-builder.ps1 -Engine D:/ue -Workspace D:/argon-validation -Descriptor $descriptor
      - name: Stage diagnostic files under one upload root
        if: always()
        run: |
          ./builder/scripts/collect-windows-diagnostics.ps1 -Engine D:/ue -Workspace D:/argon-validation -Output "$env:RUNNER_TEMP/windows-diagnostics" -RuntimeTemp $env:RUNNER_TEMP
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-engine-diagnostics
          path: ${{ runner.temp }}/windows-diagnostics/
          if-no-files-found: warn
          retention-days: 7
